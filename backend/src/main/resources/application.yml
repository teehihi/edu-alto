server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: edualto-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:edualto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

edualto:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-with-at-least-32-characters}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
      issuer: ${JWT_ISSUER:edualto}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
    otp:
      ttl-minutes: ${OTP_TTL_MINUTES:10}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      fixed-code: ${OTP_FIXED_CODE:}
  mail:
    from: ${MAIL_FROM:no-reply@edualto.local}
