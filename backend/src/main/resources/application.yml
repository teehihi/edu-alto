server:
  port: ${BACKEND_PORT:8080}

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: edualto-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edualto}
    username: ${SPRING_DATASOURCE_USERNAME:edualto}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

edualto:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://127.0.0.1:3000,http://127.0.0.1:3002,https://edu-alto.vercel.app,https://edualto.vercel.app}
  auth:
    rate-limit:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:60}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      max-clients: ${AUTH_RATE_LIMIT_MAX_CLIENTS:10000}
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
      issuer: ${JWT_ISSUER:edualto}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      domain: ${AUTH_COOKIE_DOMAIN:}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    otp:
      ttl-minutes: ${OTP_TTL_MINUTES:10}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      fixed-code: ${OTP_FIXED_CODE:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@edualto.local}
    sender-name: ${MAIL_SENDER_NAME:EduAlto}
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:edualto-media}
      endpoint: ${R2_ENDPOINT:}
      public-url-prefix: ${R2_PUBLIC_URL_PREFIX:}
  payment:
    vnpay:
      tmn-code: ${EDUALTO_PAYMENT_VNPAY_TMN_CODE:}
      hash-secret: ${EDUALTO_PAYMENT_VNPAY_HASH_SECRET:}
      payment-url: ${EDUALTO_PAYMENT_VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${EDUALTO_PAYMENT_VNPAY_RETURN_URL:}
    momo:
      partner-code: ${EDUALTO_PAYMENT_MOMO_PARTNER_CODE:}
      access-key: ${EDUALTO_PAYMENT_MOMO_ACCESS_KEY:}
      secret-key: ${EDUALTO_PAYMENT_MOMO_SECRET_KEY:}
      endpoint: ${EDUALTO_PAYMENT_MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      redirect-url: ${EDUALTO_PAYMENT_MOMO_REDIRECT_URL:}
      ipn-url: ${EDUALTO_PAYMENT_MOMO_IPN_URL:}
    sepay:
      merchant-id: ${EDUALTO_PAYMENT_SEPAY_MERCHANT_ID:}
      secret-key: ${EDUALTO_PAYMENT_SEPAY_SECRET_KEY:}
      checkout-url: ${EDUALTO_PAYMENT_SEPAY_CHECKOUT_URL:https://pay.sepay.vn/v1/checkout/init}
      success-url: ${EDUALTO_PAYMENT_SEPAY_SUCCESS_URL:http://localhost:3002/checkout/result}
      cancel-url: ${EDUALTO_PAYMENT_SEPAY_CANCEL_URL:http://localhost:3002/checkout/result}
      error-url: ${EDUALTO_PAYMENT_SEPAY_ERROR_URL:http://localhost:3002/checkout/result}
      api-key: ${EDUALTO_PAYMENT_SEPAY_API_KEY:}
      account-number: ${EDUALTO_PAYMENT_SEPAY_ACCOUNT_NUMBER:1040489156}
      bank-name: ${EDUALTO_PAYMENT_SEPAY_BANK_NAME:VCB}
      account-holder: ${EDUALTO_PAYMENT_SEPAY_ACCOUNT_HOLDER:NGUYEN NHAT THIEN}
      qr-template: ${EDUALTO_PAYMENT_SEPAY_QR_TEMPLATE:compact}
    stripe:
      api-key: ${EDUALTO_PAYMENT_STRIPE_API_KEY:}
      webhook-secret: ${EDUALTO_PAYMENT_STRIPE_WEBHOOK_SECRET:}
      success-url: ${EDUALTO_PAYMENT_STRIPE_SUCCESS_URL:}
      cancel-url: ${EDUALTO_PAYMENT_STRIPE_CANCEL_URL:}

