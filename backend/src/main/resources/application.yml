server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: edualto-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edualto}
    username: ${SPRING_DATASOURCE_USERNAME:edualto}
    password: ${SPRING_DATASOURCE_PASSWORD:hvd23110_2105}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

edualto:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://127.0.0.1:3000,http://127.0.0.1:3002,https://edualto.vercel.app}
  auth:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-with-at-least-32-characters}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
      issuer: ${JWT_ISSUER:edualto}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
    otp:
      ttl-minutes: ${OTP_TTL_MINUTES:10}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      fixed-code: ${OTP_FIXED_CODE:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@edualto.local}
    sender-name: ${MAIL_SENDER_NAME:EduAlto}
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:edualto-media}
      endpoint: ${R2_ENDPOINT:}
      public-url-prefix: ${R2_PUBLIC_URL_PREFIX:}
