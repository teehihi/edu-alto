name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: "Frontend: Format, Lint, Typecheck, Test & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Oxfmt)
        run: pnpm frontend:fmt:check

      - name: Fast Lint (Oxlint)
        run: pnpm frontend:lint:fast

      - name: Full Lint (ESLint)
        run: pnpm frontend:lint

      - name: Type check (tsc --noEmit)
        run: pnpm frontend:typecheck

      - name: Unit & Component tests (Vitest)
        run: pnpm --dir frontend test

      - name: Production build (Next.js)
        run: pnpm frontend:build

  backend:
    name: "Backend: Integration Tests (Testcontainers) & Package"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and test with Testcontainers
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml clean verify

      - name: Print failed test logs for Agent
        if: failure()
        run: grep -l "FAILURE\|ERROR" backend/target/surefire-reports/*.txt 2>/dev/null | xargs -r cat

  deploy-backend:
    name: Deploy backend to Lightsail
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [frontend, backend]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag edualto-backend:production --label org.opencontainers.image.revision="$GITHUB_SHA" .

      - name: Install production environment file
        env:
          LIGHTSAIL_ENV_FILE: ${{ secrets.LIGHTSAIL_ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.1-flash-lite' }}
        run: |
          set -euo pipefail
          if [[ -z "$LIGHTSAIL_ENV_FILE" ]]; then
            echo "Missing GitHub Actions secret: LIGHTSAIL_ENV_FILE" >&2
            exit 1
          fi
          for name in SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD JWT_SECRET CORS_ALLOWED_ORIGINS; do
            if ! grep -q "^${name}=" <<< "$LIGHTSAIL_ENV_FILE"; then
              echo "LIGHTSAIL_ENV_FILE is missing required entry: $name" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/edualto"
          umask 077
          if [[ -n "$GEMINI_API_KEY" ]]; then
            if [[ ! "$GEMINI_API_KEY" =~ ^[A-Za-z0-9_-]+$ || ! "$GEMINI_MODEL" =~ ^[A-Za-z0-9._-]{1,120}$ ]]; then
              echo "Invalid Gemini API key or model format" >&2
              exit 1
            fi
            if [[ ! "$GEMINI_FALLBACK_MODELS" =~ ^[A-Za-z0-9._,-]{0,500}$ ]]; then
              echo "Invalid Gemini fallback model format" >&2
              exit 1
            fi
            awk '!/^(AI_ENABLED|GEMINI_API_KEY|GEMINI_MODEL|GEMINI_FALLBACK_MODELS)=/' <<< "$LIGHTSAIL_ENV_FILE" > "$HOME/edualto/.env"
            printf 'AI_ENABLED=true\nGEMINI_API_KEY=%s\nGEMINI_MODEL=%s\nGEMINI_FALLBACK_MODELS=%s\n' "$GEMINI_API_KEY" "$GEMINI_MODEL" "$GEMINI_FALLBACK_MODELS" >> "$HOME/edualto/.env"
          else
            printf '%s\n' "$LIGHTSAIL_ENV_FILE" > "$HOME/edualto/.env"
          fi
          chmod 600 "$HOME/edualto/.env"

      - name: Deploy backend container
        run: |
          set -euo pipefail
          required_compose_version="2.33.1"
          compose_cli_version="$(docker compose version --short | sed 's/^v//')"
          oldest_compose_version="$(printf '%s\n%s\n' "$required_compose_version" "$compose_cli_version" | sort -V | head -n1)"
          if [[ "$oldest_compose_version" != "$required_compose_version" ]]; then
            echo "Docker Compose plugin $required_compose_version or later is required; found $compose_cli_version." >&2
            exit 1
          fi
          if ! systemctl is-active --quiet caddy; then
            echo "The host Caddy service is not active; the current deployment was left untouched." >&2
            exit 1
          fi
          if ! caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
            echo "The host Caddy configuration is invalid; the current deployment was left untouched." >&2
            exit 1
          fi
          install -m 644 docker-compose.prod.yml "$HOME/edualto/docker-compose.prod.yml"
          if docker container inspect edualto-backend >/dev/null 2>&1; then
            compose_project="$(docker container inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' edualto-backend)"
            compose_service="$(docker container inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' edualto-backend)"
            if [[ "$compose_project" != "edualto" || "$compose_service" != "backend" ]]; then
              docker container rm --force edualto-backend
            fi
          fi
          docker compose --project-directory "$HOME/edualto" \
            -f "$HOME/edualto/docker-compose.prod.yml" up -d --remove-orphans
          docker image prune -f
