name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: "Frontend: Format, Lint, Typecheck, Test & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Oxfmt)
        run: pnpm frontend:fmt:check

      - name: Fast Lint (Oxlint)
        run: pnpm frontend:lint:fast

      - name: Full Lint (ESLint)
        run: pnpm frontend:lint

      - name: Type check (tsc --noEmit)
        run: pnpm frontend:typecheck

      - name: Unit & Component tests (Vitest)
        run: pnpm --dir frontend test

      - name: Production build (Next.js)
        run: pnpm frontend:build

  backend:
    name: "Backend: Integration Tests (Testcontainers) & Package"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and test with Testcontainers
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml clean verify

      - name: Print failed test logs for Agent
        if: failure()
        run: grep -l "FAILURE\|ERROR" backend/target/surefire-reports/*.txt 2>/dev/null | xargs -r cat

  deploy-backend:
    name: Deploy backend to Lightsail
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [frontend, backend]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag edualto-backend:production --label org.opencontainers.image.revision="$GITHUB_SHA" .

      - name: Install production environment file
        env:
          LIGHTSAIL_ENV_FILE: ${{ secrets.LIGHTSAIL_ENV_FILE }}
        run: |
          set -euo pipefail
          if [[ -z "$LIGHTSAIL_ENV_FILE" ]]; then
            echo "Missing GitHub Actions secret: LIGHTSAIL_ENV_FILE" >&2
            exit 1
          fi
          for name in SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD JWT_SECRET CORS_ALLOWED_ORIGINS; do
            if ! grep -q "^${name}=" <<< "$LIGHTSAIL_ENV_FILE"; then
              echo "LIGHTSAIL_ENV_FILE is missing required entry: $name" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/edualto"
          printf '%s\n' "$LIGHTSAIL_ENV_FILE" > "$HOME/edualto/.env"
          chmod 600 "$HOME/edualto/.env"

      - name: Deploy backend container
        run: |
          set -euo pipefail
          install -m 644 docker-compose.prod.yml "$HOME/edualto/docker-compose.prod.yml"
          if docker container inspect edualto-backend >/dev/null 2>&1; then
            compose_project="$(docker container inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' edualto-backend)"
            compose_service="$(docker container inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' edualto-backend)"
            if [[ "$compose_project" != "edualto" || "$compose_service" != "backend" ]]; then
              docker container rm --force edualto-backend
            fi
          fi
          docker compose --project-directory "$HOME/edualto" \
            -f "$HOME/edualto/docker-compose.prod.yml" up -d --remove-orphans
          docker image prune -f
