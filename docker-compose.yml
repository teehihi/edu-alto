services:
  postgres:
    image: postgres:16-alpine
    container_name: edualto-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edualto}
      POSTGRES_USER: ${POSTGRES_USER:-edualto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - edualto-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edualto} -d ${POSTGRES_DB:-edualto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.0
    container_name: edualto-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edualto-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BACKEND_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-edualto}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-edualto}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://127.0.0.1:3000,http://127.0.0.1:3002,https://edu-alto.vercel.app}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_ISSUER: ${JWT_ISSUER:-edualto}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_FIXED_CODE: ${OTP_FIXED_CODE:-}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-60}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_MAX_CLIENTS: ${AUTH_RATE_LIMIT_MAX_CLIENTS:-10000}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@edualto.local}
      MAIL_SENDER_NAME: ${MAIL_SENDER_NAME:-EduAlto}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-edualto-media}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_URL_PREFIX: ${R2_PUBLIC_URL_PREFIX:-}
      EDUALTO_PAYMENT_VNPAY_TMN_CODE: ${EDUALTO_PAYMENT_VNPAY_TMN_CODE:-}
      EDUALTO_PAYMENT_VNPAY_HASH_SECRET: ${EDUALTO_PAYMENT_VNPAY_HASH_SECRET:-}
      EDUALTO_PAYMENT_VNPAY_URL: ${EDUALTO_PAYMENT_VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      EDUALTO_PAYMENT_VNPAY_RETURN_URL: ${EDUALTO_PAYMENT_VNPAY_RETURN_URL:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

