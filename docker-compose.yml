services:
  postgres:
    image: postgres:16-alpine
    container_name: edualto-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edualto}
      POSTGRES_USER: ${POSTGRES_USER:-edualto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edualto_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - edualto-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edualto} -d ${POSTGRES_DB:-edualto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edualto-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edualto-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BACKEND_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-edualto}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-edualto}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-edualto_dev_password}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: edualto-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  edualto-postgres-data:
