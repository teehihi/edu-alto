<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">EduAlto EA-inspired UML Deployment View</title>
  <desc id="desc">EA-inspired UML deployment view showing user device, web runtime, backend runtime, data runtime, and external integrations.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .node { fill: #ffffff; stroke: #4b5563; stroke-width: 2; rx: 8; }
      .artifact { fill: #fff4cf; stroke: #bfa96c; stroke-width: 1.5; rx: 6; }
      .db { fill: #eef8f4; stroke: #20b486; stroke-width: 1.8; }
      .cloud { fill: #f9fafb; stroke: #98a2b3; stroke-width: 1.8; }
      .title { fill: #101a2c; font: 700 24px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .label { fill: #101a2c; font: 700 16px Arial, Helvetica, sans-serif; }
      .text { fill: #2d2f33; font: 600 15px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .small { fill: #475467; font: 13px Arial, Helvetica, sans-serif; }
      .line { fill: none; stroke: #3f3f46; stroke-width: 1.5; marker-end: url(#arrow); }
      .bidir { fill: none; stroke: #3f3f46; stroke-width: 1.5; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .future { stroke-dasharray: 7 6; opacity: 0.8; }
      .fold { fill: #fff9e6; stroke: #bfa96c; stroke-width: 1.2; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3f3f46"/>
    </marker>
    <marker id="arrow-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#3f3f46"/>
    </marker>
  </defs>

  <rect class="page" width="1400" height="860"/>
  <text class="title" x="700" y="44">EduAlto EA-inspired Deployment View</text>

  <rect class="node" x="70" y="100" width="250" height="180"/>
  <text class="label" x="95" y="135">&lt;&lt;device&gt;&gt; User device</text>
  <rect class="artifact" x="115" y="175" width="160" height="54"/>
  <polygon class="fold" points="255,175 275,195 255,195"/>
  <text class="text" x="195" y="204">Browser</text>

  <rect class="node" x="415" y="100" width="270" height="180"/>
  <text class="label" x="440" y="135">&lt;&lt;execution env&gt;&gt; Web runtime</text>
  <rect class="artifact" x="465" y="175" width="170" height="54"/>
  <polygon class="fold" points="615,175 635,195 615,195"/>
  <text class="text" x="550" y="197">Next.js</text>
  <text class="text" x="550" y="216">Web App</text>

  <rect class="node" x="770" y="95" width="330" height="315"/>
  <text class="label" x="795" y="130">&lt;&lt;execution env&gt;&gt; Backend runtime</text>
  <rect class="artifact" x="815" y="170" width="240" height="58"/>
  <polygon class="fold" points="1035,170 1055,190 1035,190"/>
  <text class="text" x="935" y="192">Spring Boot API</text>
  <text class="text" x="935" y="211">modular monolith</text>

  <rect class="artifact" x="815" y="255" width="240" height="54"/>
  <polygon class="fold" points="1035,255 1055,275 1035,275"/>
  <text class="text" x="935" y="286">WebSocket/STOMP runtime</text>

  <rect class="artifact" x="815" y="335" width="240" height="44"/>
  <polygon class="fold" points="1035,335 1055,355 1035,355"/>
  <text class="text" x="935" y="361">Spring Security</text>

  <rect class="node" x="455" y="510" width="470" height="250"/>
  <text class="label" x="485" y="545">&lt;&lt;execution env&gt;&gt; Data runtime</text>
  <g transform="translate(505 590)">
    <path class="db" d="M0,18 a75,18 0 0 0 150,0 v78 a75,18 0 0 1 -150,0 z"/>
    <ellipse class="db" cx="75" cy="18" rx="75" ry="18"/>
    <text class="text" x="75" y="60">PostgreSQL</text>
  </g>
  <g transform="translate(720 590)">
    <path class="db" d="M0,18 a75,18 0 0 0 150,0 v78 a75,18 0 0 1 -150,0 z"/>
    <ellipse class="db" cx="75" cy="18" rx="75" ry="18"/>
    <text class="text" x="75" y="60">Redis</text>
  </g>

  <path class="cloud" d="M1055 565 C1060 525 1125 512 1154 540 C1187 505 1260 530 1258 578 C1302 585 1315 650 1271 674 C1260 715 1187 717 1162 690 C1128 720 1066 701 1078 658 C1035 648 1027 588 1055 565 Z"/>
  <text class="label" x="1168" y="565" text-anchor="middle">&lt;&lt;external&gt;&gt; Integration</text>
  <rect class="artifact" x="1090" y="595" width="155" height="40"/>
  <text class="text" x="1167" y="620">Email Provider</text>
  <rect class="artifact" x="1090" y="650" width="155" height="40"/>
  <text class="text" x="1167" y="675">Future storage</text>
  <rect class="artifact" x="1090" y="705" width="155" height="40"/>
  <text class="text" x="1167" y="730">Future AI provider</text>

  <path class="line" d="M275 202 H465"/>
  <text class="small" x="370" y="188" text-anchor="middle">HTTPS pages/assets</text>

  <path class="line" d="M635 202 H815"/>
  <text class="small" x="725" y="188" text-anchor="middle">HTTPS REST /api/v1</text>

  <path class="bidir" d="M195 229 C305 390 650 430 815 282"/>
  <text class="small" x="510" y="413" text-anchor="middle">WSS realtime</text>

  <path class="line" d="M935 228 V335"/>
  <path class="line" d="M935 309 V335"/>
  <path class="line" d="M920 379 C845 470 700 520 580 590"/>
  <text class="small" x="765" y="510" text-anchor="middle">JDBC</text>

  <path class="line" d="M950 379 C925 465 850 525 795 590"/>
  <text class="small" x="930" y="500">cache/pub-sub</text>

  <path class="line" d="M1055 200 C1135 300 1168 475 1168 595"/>
  <text class="small" x="1178" y="410">OTP/email notification</text>

  <path class="line future" d="M1055 215 C1270 280 1320 580 1245 670"/>
  <text class="small" x="1340" y="420" text-anchor="end">future document upload</text>

  <path class="line future" d="M1055 230 C1330 340 1345 690 1245 725"/>
  <text class="small" x="1340" y="470" text-anchor="end">future recommendation call</text>
</svg>
