<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="title desc">
  <title id="title">EduAlto Authentication Activity Diagram</title>
  <desc id="desc">UML activity diagram for registration, email verification, login, current user, and password reset.</desc>
  <defs>
    <style>.page{fill:#fff}.title{font:700 24px Arial;fill:#101a2c;text-anchor:middle}.lane{fill:#f8fafc;stroke:#667085;stroke-width:1.5}.act{fill:#fff4cf;stroke:#bfa96c;stroke-width:1.5;rx:18}.decision{fill:#fff;stroke:#4b5563;stroke-width:1.5}.txt{font:600 14px Arial;fill:#2d2f33;text-anchor:middle}.label{font:700 16px Arial;fill:#101a2c;text-anchor:middle}.small{font:12px Arial;fill:#475467}.line{fill:none;stroke:#3f3f46;stroke-width:1.4;marker-end:url(#arr)}.dot{fill:#101a2c}.end{fill:#fff;stroke:#101a2c;stroke-width:2}</style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f3f46"/></marker>
  </defs>
  <rect class="page" width="1180" height="900"/>
  <text class="title" x="590" y="42">Authentication and User Management Activity</text>
  <rect class="lane" x="60" y="75" width="250" height="760"/><text class="label" x="185" y="105">Client</text>
  <rect class="lane" x="310" y="75" width="350" height="760"/><text class="label" x="485" y="105">Backend API</text>
  <rect class="lane" x="660" y="75" width="240" height="760"/><text class="label" x="780" y="105">Database / Redis</text>
  <rect class="lane" x="900" y="75" width="220" height="760"/><text class="label" x="1010" y="105">Email</text>

  <circle class="dot" cx="185" cy="145" r="9"/>
  <rect class="act" x="95" y="180" width="180" height="50"/><text class="txt" x="185" y="209">Submit registration</text>
  <rect class="act" x="395" y="180" width="180" height="50"/><text class="txt" x="485" y="209">Validate request</text>
  <polygon class="decision" points="485,265 545,310 485,355 425,310"/><text class="txt" x="485" y="314">Valid?</text>
  <rect class="act" x="395" y="390" width="180" height="58"/><text class="txt" x="485" y="412">Create pending user</text><text class="txt" x="485" y="431">and role</text>
  <rect class="act" x="690" y="390" width="180" height="58"/><text class="txt" x="780" y="412">Store user, role</text><text class="txt" x="780" y="431">and hashed OTP</text>
  <rect class="act" x="930" y="390" width="160" height="58"/><text class="txt" x="1010" y="412">Send email</text><text class="txt" x="1010" y="431">verification OTP</text>

  <rect class="act" x="95" y="500" width="180" height="50"/><text class="txt" x="185" y="530">Submit OTP</text>
  <polygon class="decision" points="485,485 545,530 485,575 425,530"/><text class="txt" x="485" y="526">OTP valid</text><text class="txt" x="485" y="543">and active?</text>
  <rect class="act" x="690" y="505" width="180" height="58"/><text class="txt" x="780" y="527">Consume OTP</text><text class="txt" x="780" y="546">Activate account</text>
  <rect class="act" x="95" y="625" width="180" height="50"/><text class="txt" x="185" y="655">Login / call /me</text>
  <rect class="act" x="395" y="625" width="180" height="58"/><text class="txt" x="485" y="647">Authenticate and</text><text class="txt" x="485" y="666">issue tokens</text>
  <rect class="act" x="690" y="625" width="180" height="58"/><text class="txt" x="780" y="647">Store refresh hash</text><text class="txt" x="780" y="666">Return safe user</text>

  <rect class="act" x="930" y="625" width="160" height="58"/><text class="txt" x="1010" y="647">Password reset</text><text class="txt" x="1010" y="666">OTP email</text>
  <circle class="end" cx="780" cy="760" r="14"/><circle class="dot" cx="780" cy="760" r="7"/>

  <path class="line" d="M185 154 V180"/><path class="line" d="M275 205 H395"/><path class="line" d="M485 230 V265"/>
  <path class="line" d="M485 355 V390"/><text class="small" x="500" y="376">yes</text>
  <path class="line" d="M545 310 H620 V160 H275"/><text class="small" x="560" y="300">no: validation errors</text>
  <path class="line" d="M575 419 H690"/><path class="line" d="M870 419 H930"/>
  <path class="line" d="M1010 448 V470 H185 V500"/>
  <path class="line" d="M275 525 H425"/><path class="line" d="M545 530 H690"/><text class="small" x="560" y="518">yes</text>
  <path class="line" d="M425 530 H350 V470 H185"/><text class="small" x="335" y="520">no: attempts/error</text>
  <path class="line" d="M780 563 V600 H185 V625"/>
  <path class="line" d="M275 650 H395"/><path class="line" d="M575 654 H690"/>
  <path class="line" d="M870 654 H930"/><text class="small" x="892" y="642">forgot password branch</text>
  <path class="line" d="M780 683 V746"/>
</svg>
