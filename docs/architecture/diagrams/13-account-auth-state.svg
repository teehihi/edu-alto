<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">EduAlto Account and Auth State Diagram</title>
  <desc id="desc">UML state diagram for account verification, authentication, password reset, lock, and disable states.</desc>
  <defs>
    <style>.page{fill:#fff}.title{font:700 24px Arial;fill:#101a2c;text-anchor:middle}.state{fill:#fff4cf;stroke:#bfa96c;stroke-width:1.6;rx:22}.txt{font:700 15px Arial;fill:#2d2f33;text-anchor:middle}.line{fill:none;stroke:#3f3f46;stroke-width:1.4;marker-end:url(#arr)}.dash{stroke-dasharray:7 6}.small{font:12px Arial;fill:#475467;text-anchor:middle}.dot{fill:#101a2c}.end{fill:#fff;stroke:#101a2c;stroke-width:2}</style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f3f46"/></marker>
  </defs>
  <rect class="page" width="1180" height="760"/>
  <text class="title" x="590" y="42">Account and Authentication State Diagram</text>
  <circle class="dot" cx="90" cy="145" r="10"/>
  <rect class="state" x="165" y="115" width="190" height="60"/><text class="txt" x="260" y="150">PendingVerification</text>
  <rect class="state" x="450" y="115" width="160" height="60"/><text class="txt" x="530" y="150">Active</text>
  <rect class="state" x="735" y="115" width="170" height="60"/><text class="txt" x="820" y="150">Authenticated</text>
  <rect class="state" x="960" y="115" width="150" height="60"/><text class="txt" x="1035" y="150">LoggedOut</text>
  <rect class="state" x="420" y="310" width="280" height="60"/><text class="txt" x="560" y="345">PasswordResetRequested</text>
  <rect class="state" x="760" y="310" width="190" height="60"/><text class="txt" x="855" y="345">ResetOtpVerified</text>
  <rect class="state" x="250" y="520" width="150" height="60"/><text class="txt" x="325" y="555">Locked</text>
  <rect class="state" x="530" y="520" width="150" height="60"/><text class="txt" x="605" y="555">Disabled</text>
  <circle class="end" cx="820" cy="550" r="15"/><circle class="dot" cx="820" cy="550" r="7"/>

  <path class="line" d="M100 145 H165"/><text class="small" x="130" y="132">register</text>
  <path class="line" d="M355 145 H450"/><text class="small" x="405" y="132">email OTP verified</text>
  <path class="line" d="M610 145 H735"/><text class="small" x="670" y="132">login success</text>
  <path class="line" d="M905 145 H960"/><text class="small" x="935" y="132">logout</text>
  <path class="line" d="M1035 175 C970 245 620 235 530 175"/><text class="small" x="780" y="235">token expires</text>
  <path class="line" d="M530 175 V310"/><text class="small" x="600" y="255">forgot password</text>
  <path class="line" d="M700 340 H760"/><text class="small" x="735" y="327">reset OTP verified</text>
  <path class="line" d="M855 310 C855 230 610 220 560 175"/><text class="small" x="760" y="252">password changed</text>
  <path class="line dash" d="M560 370 C520 430 520 485 530 520"/><text class="small" x="590" y="455">reset expired</text>
  <path class="line" d="M260 175 C230 310 270 455 325 520"/><text class="small" x="245" y="350">too many OTP attempts</text>
  <path class="line" d="M530 175 C460 310 390 445 325 520"/><text class="small" x="370" y="365">security lock</text>
  <path class="line" d="M325 520 C355 420 445 245 530 175"/><text class="small" x="425" y="465">admin unlocks</text>
  <path class="line" d="M530 175 C620 310 650 430 605 520"/><text class="small" x="710" y="390">admin disables</text>
  <path class="line" d="M325 580 H530"/><text class="small" x="425" y="605">admin disables</text>
  <path class="line" d="M605 520 C620 400 590 260 530 175"/><text class="small" x="680" y="455">admin re-enables</text>
  <path class="line" d="M680 550 H805"/>
</svg>
