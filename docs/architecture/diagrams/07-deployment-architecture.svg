<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">EduAlto Local UML Deployment Diagram</title>
  <desc id="desc">UML deployment diagram for local Docker Compose runtime with browser, frontend, backend, PostgreSQL, and Redis nodes.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .node { fill: #ffffff; stroke: #4b5563; stroke-width: 2; rx: 8; }
      .node-soft { fill: #f8fafc; stroke: #667085; stroke-width: 1.6; rx: 8; }
      .artifact { fill: #fff4cf; stroke: #bfa96c; stroke-width: 1.5; rx: 6; }
      .db { fill: #eef8f4; stroke: #20b486; stroke-width: 1.8; }
      .title { fill: #101a2c; font: 700 24px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .label { fill: #101a2c; font: 700 16px Arial, Helvetica, sans-serif; }
      .small { fill: #475467; font: 13px Arial, Helvetica, sans-serif; }
      .text { fill: #2d2f33; font: 600 15px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .mono { fill: #475467; font: 13px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #3f3f46; stroke-width: 1.5; marker-end: url(#arrow); }
      .bidir { fill: none; stroke: #3f3f46; stroke-width: 1.5; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .fold { fill: #fff9e6; stroke: #bfa96c; stroke-width: 1.2; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3f3f46"/>
    </marker>
    <marker id="arrow-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#3f3f46"/>
    </marker>
  </defs>

  <rect class="page" width="1200" height="760"/>
  <text class="title" x="600" y="44">EduAlto Local Deployment Architecture</text>

  <rect class="node" x="50" y="80" width="1100" height="620"/>
  <text class="label" x="80" y="115">&lt;&lt;device&gt;&gt; Developer machine</text>

  <rect class="node-soft" x="95" y="155" width="240" height="145"/>
  <text class="label" x="120" y="190">&lt;&lt;device&gt;&gt; Browser</text>
  <rect class="artifact" x="135" y="220" width="160" height="46"/>
  <polygon class="fold" points="275,220 295,240 275,240"/>
  <text class="text" x="215" y="244">Web client</text>

  <rect class="node-soft" x="410" y="135" width="680" height="500"/>
  <text class="label" x="440" y="170">&lt;&lt;network&gt;&gt; Docker Compose network</text>

  <rect class="node-soft" x="455" y="215" width="250" height="145"/>
  <text class="label" x="480" y="250">&lt;&lt;container&gt;&gt; frontend</text>
  <rect class="artifact" x="500" y="280" width="160" height="50"/>
  <polygon class="fold" points="640,280 660,300 640,300"/>
  <text class="text" x="580" y="299">Next.js</text>
  <text class="mono" x="580" y="318">web app</text>

  <rect class="node-soft" x="795" y="215" width="250" height="145"/>
  <text class="label" x="820" y="250">&lt;&lt;container&gt;&gt; backend</text>
  <rect class="artifact" x="840" y="280" width="160" height="50"/>
  <polygon class="fold" points="980,280 1000,300 980,300"/>
  <text class="text" x="920" y="299">Spring Boot JVM</text>
  <text class="mono" x="920" y="318">modular monolith</text>

  <g transform="translate(505 445)">
    <path class="db" d="M0,18 a75,18 0 0 0 150,0 v88 a75,18 0 0 1 -150,0 z"/>
    <ellipse class="db" cx="75" cy="18" rx="75" ry="18"/>
    <text class="text" x="75" y="62">PostgreSQL</text>
    <text class="mono" x="75" y="83">postgres container</text>
  </g>

  <g transform="translate(845 445)">
    <path class="db" d="M0,18 a75,18 0 0 0 150,0 v88 a75,18 0 0 1 -150,0 z"/>
    <ellipse class="db" cx="75" cy="18" rx="75" ry="18"/>
    <text class="text" x="75" y="62">Redis</text>
    <text class="mono" x="75" y="83">redis container</text>
  </g>

  <path class="line" d="M295 243 H500"/>
  <text class="small" x="398" y="230" text-anchor="middle">localhost:3000</text>

  <path class="line" d="M660 305 H840"/>
  <text class="small" x="750" y="292" text-anchor="middle">HTTP /api/v1</text>

  <path class="bidir" d="M215 266 C215 405 655 410 920 330"/>
  <text class="small" x="475" y="407" text-anchor="middle">/ws STOMP</text>

  <path class="line" d="M900 330 C840 390 690 425 580 445"/>
  <text class="small" x="755" y="415" text-anchor="middle">JDBC</text>

  <path class="line" d="M925 330 V445"/>
  <text class="small" x="960" y="398">TCP 6379</text>
</svg>
