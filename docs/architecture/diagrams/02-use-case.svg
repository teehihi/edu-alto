<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">EduAlto UML Use Case Diagram</title>
  <desc id="desc">EA-style UML use case diagram for EduAlto LMS with Guest, Student, Instructor, and Administrator actors.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .boundary { fill: #ffffff; stroke: #4b5563; stroke-width: 2; }
      .title { fill: #101a2c; font: 700 22px Arial, Helvetica, sans-serif; }
      .actor { fill: none; stroke: #333333; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .actor-right { stroke: #9b5d53; }
      .actor-label { fill: #2f343b; font: 600 18px Arial, Helvetica, sans-serif; }
      .usecase { fill: #fff4cf; stroke: #bfa96c; stroke-width: 1.6; }
      .usecase-future { fill: #f7f8fa; stroke: #98a2b3; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .usecase-text { fill: #2d2f33; font: 600 16px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #3f3f46; stroke-width: 1.35; stroke-linecap: round; opacity: 0.76; }
      .line-right { stroke: #5f4440; }
      .line-future { stroke: #667085; stroke-dasharray: 7 6; opacity: 0.8; }
      .note { fill: #667085; font: 13px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect class="page" width="1400" height="940"/>
  <rect class="boundary" x="360" y="70" width="680" height="810"/>
  <text class="title" x="700" y="112" text-anchor="middle">EduAlto LMS</text>

  <!-- Actor associations -->
  <g>
    <line class="line" x1="185" y1="220" x2="420" y2="165"/>
    <line class="line" x1="185" y1="220" x2="695" y2="165"/>
    <line class="line" x1="185" y1="220" x2="555" y2="245"/>

    <line class="line" x1="185" y1="610" x2="420" y2="325"/>
    <line class="line" x1="185" y1="610" x2="695" y2="325"/>
    <line class="line" x1="185" y1="610" x2="420" y2="405"/>
    <line class="line" x1="185" y1="610" x2="695" y2="405"/>
    <line class="line" x1="185" y1="610" x2="420" y2="485"/>
    <line class="line" x1="185" y1="610" x2="695" y2="485"/>
    <line class="line" x1="185" y1="610" x2="420" y2="565"/>
    <line class="line" x1="185" y1="610" x2="695" y2="565"/>
    <line class="line" x1="185" y1="610" x2="420" y2="645"/>
    <line class="line" x1="185" y1="610" x2="695" y2="645"/>
    <polyline class="line line-future" points="185,610 300,730 355,850 530,850" fill="none"/>

    <line class="line line-right" x1="1215" y1="520" x2="665" y2="725"/>
    <line class="line line-right" x1="1215" y1="520" x2="945" y2="725"/>
    <line class="line line-right" x1="1215" y1="520" x2="665" y2="565"/>
    <line class="line line-right" x1="1215" y1="520" x2="945" y2="565"/>

    <line class="line line-right" x1="1215" y1="765" x2="665" y2="805"/>
    <line class="line line-right" x1="1215" y1="765" x2="945" y2="805"/>
  </g>

  <!-- Use cases -->
  <g>
    <ellipse class="usecase" cx="540" cy="165" rx="125" ry="32"/>
    <text class="usecase-text" x="540" y="165">Browse courses</text>

    <ellipse class="usecase" cx="820" cy="165" rx="125" ry="32"/>
    <text class="usecase-text" x="820" y="158">Register and verify</text>
    <text class="usecase-text" x="820" y="178">email</text>

    <ellipse class="usecase" cx="680" cy="245" rx="125" ry="32"/>
    <text class="usecase-text" x="680" y="245">Login / logout</text>

    <ellipse class="usecase" cx="540" cy="325" rx="125" ry="32"/>
    <text class="usecase-text" x="540" y="325">Enroll in course</text>

    <ellipse class="usecase" cx="820" cy="325" rx="125" ry="32"/>
    <text class="usecase-text" x="820" y="325">Learn lesson</text>

    <ellipse class="usecase" cx="540" cy="405" rx="125" ry="32"/>
    <text class="usecase-text" x="540" y="398">View learning</text>
    <text class="usecase-text" x="540" y="418">progress</text>

    <ellipse class="usecase" cx="820" cy="405" rx="125" ry="32"/>
    <text class="usecase-text" x="820" y="405">Submit quiz</text>

    <ellipse class="usecase" cx="540" cy="485" rx="125" ry="32"/>
    <text class="usecase-text" x="540" y="485">Submit assignment</text>

    <ellipse class="usecase" cx="820" cy="485" rx="125" ry="32"/>
    <text class="usecase-text" x="820" y="478">Save document</text>
    <text class="usecase-text" x="820" y="498">and notes</text>

    <ellipse class="usecase" cx="540" cy="565" rx="125" ry="32"/>
    <text class="usecase-text" x="540" y="565">Discuss and message</text>

    <ellipse class="usecase" cx="820" cy="565" rx="125" ry="32"/>
    <text class="usecase-text" x="820" y="558">Receive</text>
    <text class="usecase-text" x="820" y="578">notification</text>

    <ellipse class="usecase" cx="540" cy="645" rx="125" ry="32"/>
    <text class="usecase-text" x="540" y="645">Review course</text>

    <ellipse class="usecase" cx="820" cy="645" rx="125" ry="32"/>
    <text class="usecase-text" x="820" y="638">Receive</text>
    <text class="usecase-text" x="820" y="658">certificate</text>

    <ellipse class="usecase" cx="540" cy="725" rx="125" ry="32"/>
    <text class="usecase-text" x="540" y="718">Manage course</text>
    <text class="usecase-text" x="540" y="738">content</text>

    <ellipse class="usecase" cx="820" cy="725" rx="125" ry="32"/>
    <text class="usecase-text" x="820" y="725">Review submissions</text>

    <ellipse class="usecase" cx="540" cy="805" rx="125" ry="32"/>
    <text class="usecase-text" x="540" y="798">Manage users,</text>
    <text class="usecase-text" x="540" y="818">roles, content</text>

    <ellipse class="usecase" cx="820" cy="805" rx="125" ry="32"/>
    <text class="usecase-text" x="820" y="805">View analytics</text>

    <ellipse class="usecase-future" cx="680" cy="850" rx="150" ry="26"/>
    <text class="usecase-text" x="680" y="844">Receive future</text>
    <text class="usecase-text" x="680" y="862">recommendations</text>
  </g>

  <!-- Actors -->
  <g transform="translate(155 220)">
    <circle class="actor" cx="0" cy="-42" r="11"/>
    <line class="actor" x1="0" y1="-31" x2="0" y2="24"/>
    <line class="actor" x1="-31" y1="-5" x2="31" y2="-5"/>
    <line class="actor" x1="0" y1="24" x2="-28" y2="62"/>
    <line class="actor" x1="0" y1="24" x2="28" y2="62"/>
    <text class="actor-label" x="0" y="95" text-anchor="middle">Guest</text>
  </g>

  <g transform="translate(155 610)">
    <circle class="actor" cx="0" cy="-42" r="11"/>
    <line class="actor" x1="0" y1="-31" x2="0" y2="24"/>
    <line class="actor" x1="-31" y1="-5" x2="31" y2="-5"/>
    <line class="actor" x1="0" y1="24" x2="-28" y2="62"/>
    <line class="actor" x1="0" y1="24" x2="28" y2="62"/>
    <text class="actor-label" x="0" y="95" text-anchor="middle">Student</text>
  </g>

  <g transform="translate(1245 520)">
    <circle class="actor actor-right" cx="0" cy="-42" r="11"/>
    <line class="actor actor-right" x1="0" y1="-31" x2="0" y2="24"/>
    <line class="actor actor-right" x1="-31" y1="-5" x2="31" y2="-5"/>
    <line class="actor actor-right" x1="0" y1="24" x2="-28" y2="62"/>
    <line class="actor actor-right" x1="0" y1="24" x2="28" y2="62"/>
    <text class="actor-label" x="0" y="95" text-anchor="middle">Instructor</text>
  </g>

  <g transform="translate(1245 765)">
    <circle class="actor actor-right" cx="0" cy="-42" r="11"/>
    <line class="actor actor-right" x1="0" y1="-31" x2="0" y2="24"/>
    <line class="actor actor-right" x1="-31" y1="-5" x2="31" y2="-5"/>
    <line class="actor actor-right" x1="0" y1="24" x2="-28" y2="62"/>
    <line class="actor actor-right" x1="0" y1="24" x2="28" y2="62"/>
    <text class="actor-label" x="0" y="95" text-anchor="middle">Administrator</text>
  </g>

  <text class="note" x="680" y="910" text-anchor="middle">Dashed association marks a future AI recommendation extension; LMS core use cases remain unchanged.</text>
</svg>
