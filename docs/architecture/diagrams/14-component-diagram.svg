<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="880" viewBox="0 0 1450 880" role="img" aria-labelledby="title desc">
  <title id="title">EduAlto UML Component Diagram</title>
  <desc id="desc">UML component diagram for EduAlto frontend, backend modular monolith modules, PostgreSQL, Redis, email, and future AI provider.</desc>
  <defs>
    <style>.page{fill:#fff}.title{font:700 24px Arial;fill:#101a2c;text-anchor:middle}.pkg{fill:#f8fafc;stroke:#667085;stroke-width:1.6;rx:8}.comp{fill:#fff4cf;stroke:#bfa96c;stroke-width:1.5;rx:6}.head{fill:#fff9e6}.label{font:700 16px Arial;fill:#101a2c}.txt{font:700 14px Arial;fill:#2d2f33;text-anchor:middle}.small{font:12px Arial;fill:#475467;text-anchor:middle}.line{fill:none;stroke:#3f3f46;stroke-width:1.3;marker-end:url(#arr)}.dash{stroke-dasharray:7 6}.db{fill:#eef8f4;stroke:#20b486;stroke-width:1.6}.cloud{fill:#f9fafb;stroke:#98a2b3;stroke-width:1.6}</style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f3f46"/></marker>
  </defs>
  <rect class="page" width="1450" height="880"/>
