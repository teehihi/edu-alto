  <rect class="pkg" x="55" y="85" width="300" height="710"/><text class="label" x="80" y="120">Frontend</text>
  <rect class="comp" x="95" y="160" width="220" height="62"/><text class="txt" x="205" y="187">Next.js App Router</text><text class="small" x="205" y="207">React + TypeScript</text>
  <rect class="comp" x="95" y="275" width="220" height="62"/><text class="txt" x="205" y="302">Vietnamese UI</text><text class="small" x="205" y="322">forms, states, components</text>
  <rect class="comp" x="95" y="390" width="220" height="62"/><text class="txt" x="205" y="417">API Client</text><text class="small" x="205" y="437">env-based base URL</text>
  <rect class="comp" x="95" y="505" width="220" height="62"/><text class="txt" x="205" y="532">WebSocket Client</text><text class="small" x="205" y="552">messaging/notification</text>

