services:
  redis:
    image: redis:8.8.0
    container_name: edualto-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  backend:
    image: edualto-backend:production
    container_name: edualto-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        format: raw
    environment:
      BACKEND_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      edge:
        gw_priority: 1
      data: {}

networks:
  edge:
  data:
    internal: true
